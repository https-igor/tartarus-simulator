<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com">
<title>Tartarus Overlay marks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
  /* Marks drawn on the game window: bright, thick, outlined in black so
   * they read on the game's dark art. The window lets every click through. */
  :root {
    --go: #3dff6e;
    --target: #ffc935;
    --hint: #34e6ff;
    --ink: rgba(0, 0, 0, 0.82);
    --chalk: #f2f4f7;
    --stone: #0f1216;
    --font-body: "Barlow Semi Condensed", "Segoe UI", system-ui, sans-serif;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    pointer-events: none;
  }

  svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .edge {
    fill: none;
    stroke: var(--ink);
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .line {
    fill: none;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .is-go { stroke: var(--go); }
  .is-target { stroke: var(--target); }
  .is-hint { stroke: var(--hint); }
  .head.is-go { fill: var(--go); }
  .head.is-target { fill: var(--target); }

  /* "Check this": the ring breathes. */
  .pulse {
    transform-box: fill-box;
    transform-origin: center;
    animation: pulse 1.1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(1.12); }
  }

  /* "Likely, still checking": the move isn't final, so it's faint and
   * dashed (marks.js thins the line) and flickers softly. It goes solid
   * when the live check gives the final move. */
  .is-likely {
    opacity: 0.45;
    animation: likely 1.6s ease-in-out infinite;
  }

  @keyframes likely {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 0.28; }
  }

  .label {
    font: 700 var(--label-size, 18px)/1 var(--font-body);
    paint-order: stroke;
    stroke: var(--ink);
    stroke-width: 5px;
    stroke-linejoin: round;
  }

  .label.is-go { fill: var(--go); stroke: var(--ink); }
  .label.is-target { fill: var(--target); stroke: var(--ink); }
  .label.is-hint { fill: var(--hint); stroke: var(--ink); }

  .title {
    position: absolute;
    top: 4.5%;
    left: 50%;
    transform: translateX(-50%);
    max-width: 80%;
    padding: 0.3em 1em 0.35em;
    border: 2px solid var(--go);
    border-radius: 999px;
    background: color-mix(in srgb, var(--stone) 88%, transparent);
    box-shadow: 0 0 0 2px var(--ink), 0 4px 14px rgba(0, 0, 0, 0.6);
    color: var(--chalk);
    font: 700 var(--title-size, 22px)/1.1 var(--font-body);
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .title.is-likely {
    border-style: dashed;
    color: color-mix(in srgb, var(--chalk) 75%, transparent);
  }

  .title[hidden] {
    display: none;
  }
</style>
</head>
<body>
<svg id="marks" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
<div class="title" id="title" hidden></div>
<script src="marks.js"></script>
</body>
</html>
